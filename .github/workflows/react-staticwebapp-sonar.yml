name: React CI/CD with SonarCloud & Azure Static Web Apps

on:
  push:
    branches:
      - Mohan

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '22'

  SONAR_ORGANIZATION: raghava-devsecops
  SONAR_PROJECT_KEY: raghava-devsecops

jobs:
  ################################################################################
  # BUILD
  ################################################################################

  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Production Environment File
        env:
          CLIENT_ID: ${{ secrets.REACT_APP_AD_CLIENT_ID }}
          TENANT_ID: ${{ secrets.REACT_APP_AD_TENANT_ID }}
          API_URL: ${{ secrets.REACT_APP_API_URL }}
          CLIENT_SECRET: ${{ secrets.REACT_APP_AD_CLIENT_SECRET }}
        run: |
          echo "REACT_APP_AD_CLIENT_ID=${CLIENT_ID}" > .env.production
          echo "REACT_APP_AD_TENANT_ID=${TENANT_ID}" >> .env.production
          echo "REACT_APP_API_URL=${API_URL}" >> .env.production
          echo "REACT_APP_AD_CLIENT_SECRET=${CLIENT_SECRET}" >> .env.production
          echo "--- .env.production contents (keys only) ---"
          cut -d'=' -f1 .env.production
          echo "CLIENT_ID set: ${{ secrets.REACT_APP_AD_CLIENT_ID != '' }}"
          echo "TENANT_ID set: ${{ secrets.REACT_APP_AD_TENANT_ID != '' }}"

      - name: Build React Application
        run: npm run build
        env:
          REACT_APP_AD_CLIENT_ID: ${{ secrets.REACT_APP_AD_CLIENT_ID }}
          REACT_APP_AD_TENANT_ID: ${{ secrets.REACT_APP_AD_TENANT_ID }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_AD_CLIENT_SECRET: ${{ secrets.REACT_APP_AD_CLIENT_SECRET }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build
          retention-days: 1
        continue-on-error: true

  ################################################################################
  # DEPLOY
  ################################################################################

  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build
        continue-on-error: true

      - name: Rebuild if Artifact Missing
        run: |
          if [ ! -d "build" ] || [ -z "$(ls -A build)" ]; then
            echo "Build artifact not found or empty. Rebuilding..."
            node --version
            npm --version
            npm ci
            npm run build
          else
            echo "Build artifact found. Proceeding to deploy."
          fi
        env:
          REACT_APP_AD_CLIENT_ID: ${{ secrets.REACT_APP_AD_CLIENT_ID }}
          REACT_APP_AD_TENANT_ID: ${{ secrets.REACT_APP_AD_TENANT_ID }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_AD_CLIENT_SECRET: ${{ secrets.REACT_APP_AD_CLIENT_SECRET }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'build'
          skip_app_build: true
          output_location: ''
